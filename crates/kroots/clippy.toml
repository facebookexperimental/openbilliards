disallowed-methods = [
  { path = "f64::mul_add", reason = "fused multiply-add changes results across targets" },
  { path = "f64::powi", reason = "precision unspecified" },
  { path = "f64::powf", reason = "not needed; non-deterministic across libm versions" },
  { path = "f64::exp_m1", reason = "determinism contract" },
  { path = "f64::ln_1p", reason = "determinism contract" },
  { path = "f64::sinh", reason = "determinism contract" },
  { path = "f64::cosh", reason = "determinism contract" },
  { path = "f64::tanh", reason = "determinism contract" },
  { path = "f64::asinh", reason = "determinism contract" },
  { path = "f64::acosh", reason = "determinism contract" },
  { path = "f64::atanh", reason = "determinism contract" },
]
