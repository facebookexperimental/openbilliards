# Float discipline (feature 013 research R11, migration-gate check M2):
# verdicts must be byte-identical between the wasm artifact (TS surface)
# and native builds (py/cli), so judgment-relevant arithmetic is restricted
# to IEEE-754-exact operations — `+ - * /`, `sqrt`, comparisons. `hypot`,
# `mul_add`, and every transcendental without a correctly-rounded guarantee
# are forbidden crate-wide.
disallowed-methods = [
    { path = "f64::hypot", reason = "not correctly rounded; use sqrt(dx*dx + dy*dy) (research R11)" },
    { path = "f64::mul_add", reason = "fused rounding diverges from the JS a*b+c the oracle used (research R11)" },
    { path = "f64::sin", reason = "transcendentals are not correctly rounded across targets (research R11)" },
    { path = "f64::cos", reason = "transcendentals are not correctly rounded across targets (research R11)" },
    { path = "f64::tan", reason = "transcendentals are not correctly rounded across targets (research R11)" },
    { path = "f64::asin", reason = "transcendentals are not correctly rounded across targets (research R11)" },
    { path = "f64::acos", reason = "transcendentals are not correctly rounded across targets (research R11)" },
    { path = "f64::atan", reason = "transcendentals are not correctly rounded across targets (research R11)" },
    { path = "f64::atan2", reason = "transcendentals are not correctly rounded across targets (research R11)" },
    { path = "f64::sinh", reason = "transcendentals are not correctly rounded across targets (research R11)" },
    { path = "f64::cosh", reason = "transcendentals are not correctly rounded across targets (research R11)" },
    { path = "f64::tanh", reason = "transcendentals are not correctly rounded across targets (research R11)" },
