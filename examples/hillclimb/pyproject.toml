[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openbilliards-hillclimb"
version = "0.1.0"
description = "Simulation-based hillclimbing of billiards agents on the openbilliards kernel"
readme = "README.md"
license = "MIT"
# LICENSE (the repository's MIT License text) and NOTICE ride in every wheel and source archive.
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
# The kernel binding (the pool_py module) is built from this repository's source; see README.md.
# Play-time dependencies: numpy for the C2 evaluator, scipy for the scrambled Sobol stroke pool.
dependencies = [
    "numpy==2.5.1",
    # The Sobol pool seeds qmc.Sobol with its transitional seed= keyword: rng= with the same
    # integer draws another scramble (not bit-equal), so the pool and its tests hold to this pin.
    "scipy==1.18.0",
]

[project.optional-dependencies]
# Training extras: torch fits C2, scikit-learn fits V. Neither is needed to play or to evaluate.
train = [
    "torch==2.13.0",
    "scikit-learn==1.7.2",
]

[tool.setuptools.packages.find]
include = ["hillclimb", "hillclimb.*", "straightpool", "straightpool.*", "hillclimb_examples",
           "hillclimb_examples.*"]

[tool.setuptools.package-data]
"hillclimb_examples.models" = ["*.json", "*.json.gz", "*.md"]
