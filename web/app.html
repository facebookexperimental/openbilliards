<style>
  /* module styles: CONSUME --ob-* tokens only (tokens.css owns definitions).
     the pure-black body backdrop is the scene clear color, not a panel
     surface (annotated ob-color-exempt below). */
  html, body { margin: 0; padding: 0; background: #000; /* ob-color-exempt: scene clear color */ overflow: hidden; }
  /* the design charter's geometry contracts: the rem root stays the UA 16px —
     the product's 14px body size lives on <body> ONLY. font-size on <html>
     would deflate every rem token by 12.5% (12px labels render 10.5px). */
  html { font-size: 100%; }
  body { font-family: var(--ob-font); font-size: var(--ob-fs-0);
         font-weight: var(--ob-fw-reg); line-height: var(--ob-lh-body);
         color: var(--ob-text-0); }
  canvas { display: block; }
  /* #err: LAST-RESORT surface for GENUINE errors only (boot failures,
     mirror drift, frame-hook exceptions, unhandled rejections — expected
     gameplay rejections ride the HUD hint banner instead, web/app/flow.js).
     Styled STATICALLY here because it must render on the no-JS boot-guard
     path, with literal fallbacks inside var() because tokens.css itself is
     a [data-optional] link that can fail. Quiet danger card on the panel
     register: glass well, danger hairline, 12px card radius, mono detail
     voice, height capped with scroll. Hidden while empty; main.js
     deduplicates rows (×N counter) and re-shows after a dismiss. */
  #err { position: fixed; top: var(--ob-sp-2, 8px); left: var(--ob-sp-2, 8px);
         z-index: 9; box-sizing: border-box; max-width: 60ch;
         max-height: 40vh; overflow-y: auto; overscroll-behavior: contain;
         background: var(--ob-glass, oklch(15.5% 0.01 165 / 0.92));
         backdrop-filter: blur(var(--ob-blur, 14px));
         -webkit-backdrop-filter: blur(var(--ob-blur, 14px));
         border: 1px solid var(--ob-danger-line, oklch(66% 0.18 28 / 0.55));
         border-radius: var(--ob-r-l, 12px);
         box-shadow: var(--ob-el-2, 0 6px 20px oklch(0% 0 0 / 0.42));
         padding: var(--ob-sp-2, 8px) var(--ob-sp-3, 12px);
         color: var(--ob-danger-text, oklch(92% 0.05 28));
         font: var(--ob-fs--1, 12px)/1.5 ui-monospace, Menlo, monospace;
         white-space: pre-wrap; overflow-wrap: break-word; }
  #err:empty, #err[hidden] { display: none; }
  #err .err-row { display: flex; align-items: baseline;
                  gap: var(--ob-sp-2, 8px); padding: 2px 0; }
  #err .err-row + .err-row { margin-top: 2px; padding-top: 4px;
         border-top: 1px dashed var(--ob-line-0, oklch(97% 0.01 91 / 0.08)); }
  #err .err-msg { flex: 1 1 auto; min-width: 0; }
  #err .err-n { flex: 0 0 auto; /* repeat counter — trailing, chip register */
         font-size: var(--ob-fs--1, 12px);
         font-weight: var(--ob-fw-semi, 620);
         color: var(--ob-danger, oklch(66% 0.18 28));
         border: 1px solid var(--ob-danger-line, oklch(66% 0.18 28 / 0.55));
         border-radius: var(--ob-r-full, 999px); padding: 0 6px; }
  #err-x { /* dismiss: quiet ghost pill, sticky through the scroll cap */
         position: sticky; top: 0; display: block; margin-left: auto;
         appearance: none; width: 20px; height: 20px; padding: 0;
         line-height: 1; font: inherit; cursor: pointer;
         color: inherit; background: transparent;
         border: 1px solid var(--ob-danger-line, oklch(66% 0.18 28 / 0.55));
         border-radius: var(--ob-r-full, 999px); }
  /* terminal BOOT FAILED (boot guard, bottom of <body>): the module graph
     died AGAIN after the one-shot cache heal — the app never booted, i18n
     never loads, so the static chrome skeleton (#hud/#help/#ob-toolbar with
     empty data-i18n labels, dead controls) is dead ink and must not show
     behind the #err card (QA #81). The guard stamps <body>; everything but
     #err drops. !important (the #ob-toolbar > * precedent): a boot that
     died between scene-up and __test-live leaves elements carrying INLINE
     display (three.js canvas, aimwidgets #aimw) that outrank any plain
     rule. Runtime errors over a HEALTHY app never stamp (the guard exits
     on window.__test), so live chrome behind a mid-session #err stays. */
  /* GH-694: #ob-boot is exempt — in failure mode it IS the honest card
     (reason + Retry) and sits under #err (its z drops to 8, rule below). */
  body[data-ob-boot-failed] > :not(#err):not(#ob-boot) { display: none !important; }
  /* HUD: glass panel via .ob-panel (kit.css); module block owns placement +
     row layout. Width stays ~236px (aim widgets align to it). */
  #hud { position: fixed; right: var(--ob-sp-3); top: 54px;
         /* below the 34px toolbar at top:10 — decoupled surfaces: wide
            locale pills must never breach the panel edge */
         width: 236px; z-index: 5; box-sizing: border-box;
         /* bottom = sp-4: the chip row is solid ink to its rect edge while
            the title's ink starts ~3px into its line box — 12/16 makes the
            top and bottom OPTICAL gaps match (panel rhythm law, ±2px) */
         padding: var(--ob-sp-3) var(--ob-sp-4) var(--ob-sp-4); }
  #hud h1 { /* the kit title role (.ob-panel__title, 16 px — GH-1180) on the compact HUD's sp-2 rhythm */
            font-size: var(--ob-fs-1); font-weight: var(--ob-fw-semi);
            line-height: var(--ob-lh-tight); color: var(--ob-text-0);
            margin: 0 0 var(--ob-sp-2); }
  #hud .row { display: flex; align-items: center; gap: var(--ob-sp-2);
              margin: var(--ob-sp-2) 0; }
  #hud label { flex: 0 0 80px; color: var(--ob-text-2);
               /* 80px fits the widest caps label across locales at the
                  design 12px (INCLINAISON/INCLINACIÓN = 79px) so both
                  slider tracks share one start x (panel rhythm) */
               font-size: var(--ob-fs--1); font-weight: var(--ob-fw-semi);
               letter-spacing: var(--ob-track-caps); white-space: nowrap;
               text-transform: uppercase; } /* one caps dialect everywhere */
  /* the toggle row has slack: its label takes natural width so SLOW-MO /
     CÁMARA LENTA never hyphen- or space-wrap. [for]
     scopes it to the TEXT label — the kit's .ob-toggle wrapper label must
     not inherit the column basis (a 34px track in an 80px ghost box). */
  #hud .row:has(input[type=checkbox]) label[for] { flex: 0 0 auto;
               min-width: 80px; }
  #hud .row label.ob-toggle { flex: 0 0 auto; min-width: 0; }
  /* the rate value sits on the same right rail as the slider values */
  #hud .row:has(input[type=checkbox]) .val { margin-left: auto; }
  /* mid-rack cue swap select (design 277 slice 3 PR-2): native fallback
     styling in the HUD voice — the kit upgrade (ui/select.js) hides it
     behind the .ob-select combobox (kit.css owns that geometry). The row
     STACKS (label line above, control full-width below): the 80px label
     column would leave the closed combobox ~116px and the kit label's
     ellipsis would truncate long localized cue names — control labels
     never ellipsize (the e2e-ui law). */
  #cue-row { flex-wrap: wrap; }
  #cue-row label { flex: 1 0 100%; }
  #cue-row select, #cue-row .ob-select { flex: 1 1 100%; min-width: 0; }
  /* …and the closed label WRAPS instead of ellipsizing (kit.css defaults
     to nowrap+ellipsis): catalog cue names run 30+ chars localized, past
     any width this panel can give one line — the settings popover rows
     already wrap under the same law */
  #cue-row .ob-select { height: auto; } /* the kit control rung (40) stands (uiaudit GH-1009: a 32 px floor + the
                                           #hud button pads put the trigger at 34 px / 12 px under 40 px pills) */
  /* the select label wraps by kit law (GH-668 B-K21, step 9) — the #cue-row
     restatement is gone */
  #hud .row select { flex: 1; min-width: 0; font: inherit;
    color: var(--ob-text-1); background: var(--ob-glass);
    border: 1px solid var(--ob-line-1); border-radius: var(--ob-r-s);
    padding: var(--ob-sp-1); }
  #hud input[type=range] { flex: 1; min-width: 0;
                           accent-color: var(--ob-accent); }
  #hud .val { flex: 0 0 50px; /* widest value "12.0 m/s" = 48px at 12px
              tabular nums — 50 clears it and buys the slider track width */
              text-align: right; color: var(--ob-text-0);
              font-size: var(--ob-fs--1);
              font-variant-numeric: tabular-nums; }
  #tip { display: block; margin: var(--ob-sp-1) auto; cursor: crosshair;
         width: 92px; height: 92px; }
  /* GH-1051: the pad is the spin control's keyboard stop (hud.js) — the
     kit focus ring, round like the pad */
  #tip:focus-visible { outline: none; box-shadow: var(--ob-focus);
                       border-radius: 50%; }
  #hud button:not(.ob-select) { flex: 1 1 auto; padding: var(--ob-sp-2) var(--ob-sp-1);
                font-size: var(--ob-fs--1); } /* nowrap labels share the row
                by content width — long locales grow, never wrap. The kit
                select trigger is a <button> too: it keeps the kit control
                voice (uiaudit GH-1009). */
  /* four actions (10-ball push-out joins Shoot / Replay / Re-rack) share a
     2 x 2 grid instead of a 3 + 1 wrap that stretched Re-rack — the
     destructive action — to the full panel width (uiaudit GH-1009) */
  #hud .row:has(> #aw-push:not([style*="none"])) { display: grid;
                grid-template-columns: 1fr 1fr; }
  /* pills that outgrow the row (ja ラックを組み直す) wrap to a second row
     instead of breaching the panel edge (decoupled-surfaces law) */
  #hud .row:has(button) { flex-wrap: wrap; }
  #state { margin-top: var(--ob-sp-2); color: var(--ob-text-1);
           font-size: var(--ob-fs--1); min-height: 36px; /* 2-line slot:
           locale wraps must not collapse the rhythm below */ }
  #rack { margin-top: var(--ob-sp-2); display: flex; gap: 3px;
          flex-wrap: wrap; } /* 9 x 19px + 8 x 3px = 195 <= content width */
  .chip { width: 19px; height: 19px; border-radius: var(--ob-r-full);
          background: #efe9d8; /* ob-color-exempt: ball ivory (matches hud.js drawTip face) */
          color: #222; /* ob-color-exempt: chip glyph on ball-cream */
          display: inline-flex; align-items: center;
          justify-content: center; font-weight: var(--ob-fw-bold);
          font-size: var(--ob-fs--1); }
  .chip.down { opacity: 0.25; text-decoration: line-through; }
  /* banner: glass + type from .ob-banner (kit.css); placement here. hud.js
     toggles display + the .foul tone class. */
  /* centered via margins, NOT translateX: motion.js owns el.style.transform
     during banner enter/exit tweens (a transform-based centering would snap
     half a width sideways on clearProps). */
  /* pointer-events none (issue #71): the banner is PASSIVE CHROME — a tap
     in its box passes through to the game surface beneath (pre-#71 the
     strip swallowed the pointer and the owner waited the timer out);
     tap-to-dismiss lives in hud.js. It has no interactive children. */
  #banner { display: none; position: fixed; left: 0; right: 0; top: 18%;
            margin-inline: auto; width: fit-content; z-index: 6;
            pointer-events: none;
            /* QA finding: the banner had NO desktop width cap, so
               long real judgment copy (de two-foul + cite strings) painted
               its z:6 glass over the z:5 HUD panel's rows at 1280x800
               (64.1x62.8px measured). Centered geometry: the cap keeps the
               banner's right edge left of the panel (right sp-3, 236px wide)
               by >= sp-3 at ANY copy length — long reasons WRAP inside it
               (no-ellipsize law; the phone register keeps its own touch.css
               §3.11 cap, which outranks this one under html.ob-touch). */
            max-width: calc(100vw - 2 * (236px + 2 * var(--ob-sp-3))); }
  /* GH-1180: the leaving text rides the exit fade (hud.setBanner) — shown only
     while the box is empty, so a banner written meanwhile never doubles */
  #banner:empty[data-ob-fade]::before { content: attr(data-ob-fade); }
  /* fouls must read as a penalty, not success green (hud.setBanner tone) */
  #banner.foul { background: linear-gradient(var(--ob-danger-dim),
                   var(--ob-danger-dim)), var(--ob-glass);
                 border-color: var(--ob-danger-line);
                 color: var(--ob-danger-text); }
  /* toolbar: one flex container replaces four magic right-offsets — pills
     size to content, uniform gap, collisions impossible in any locale.
     Modules append their buttons here when present (feature-detected; an
     old cached module falls back to its own fixed positioning). */
  #ob-toolbar { position: fixed; top: 10px; right: 10px; z-index: 40;
                display: flex; align-items: center; gap: var(--ob-sp-3); }
  #ob-toolbar > * { position: static !important; /* neutralize modules'
                fixed-position fallback styles once containered */
                box-sizing: border-box; display: inline-flex;
                align-items: center; /* one pill height for the family */
                font-size: var(--ob-fs--1); /* ONE text token (12px) and one
                line-height for every text pill — modules restate the same
                values for their stale-cache fixed-position fallback */
                line-height: var(--ob-lh-body); }
  /* the family height at ZERO specificity: the kit toolbar part
     (.ob-btn--icon / .ob-toolbar-pill, GH-668 B-K16) owns its rungs —
     34 on fine pointers, 44 under html.ob-touch (G10, the ONE coarse
     floor) — and a plain id rule here outranked it (44 × 34 pills on the
     phone registers, e2e-ui --audit tap floor); kit-less siblings keep 34 */
  :where(#ob-toolbar > *) { height: var(--ob-h-toolbar); }
  #ob-toolbar > #ob-export-btn { order: 1; }
  #ob-toolbar > #ob-record { order: 2; }
  #ob-toolbar > #ob-share { order: 3; }
  #ob-toolbar > #ob-gear { order: 4; }
  #ob-toolbar > #ob-help { order: 5; }
  #help { position: fixed; left: var(--ob-sp-3); bottom: var(--ob-sp-2);
          z-index: 5; font-size: var(--ob-fs--1);
          /* the SOLID rung + the text-1 hint role (uiaudit GH-1014; the ground
             law, tokens.css): text-2 on the 62 % thin glass sampled 2.74:1
             over the felt — the scene set the ground */
          color: var(--ob-text-1); background: var(--ob-glass-solid);
          border-radius: var(--ob-r-s);
          padding: var(--ob-sp-1) var(--ob-sp-2); }
  /* ---- #ob-boot: boot loading overlay (issue #48; GH-668 S5 slice 2,
     B-SH03 / owner Q1 default B) -----------------------------------------
     The hall's FIRST FRAME: a quiet wordmark on the slate void, one
     stage-driven progress rung with the current stage word beside it, the
     tagline in the body role under it. Lives INLINE (markup + styles +
     classic driver script, below) because it must paint before the module
     graph loads (the ownership ledger corollary — no new import edges into
     main.js's boot graph); every var() carries a literal fallback because
     tokens.css / kit.css are [data-optional] links that can fail, and this
     overlay is exactly the surface that renders when they do (#err doctrine
     above). The kit class names below (.ob-progress / .ob-progress__fill /
     .ob-btn) are BELTS: this sheet restates the kit part with literal
     fallbacks and never states what the kit part does not (the design charter
     progress + button recipes; GH-668 kit follow-up 3 documents the
     first-paint restatement). NO entrance animation: every node paints AT
     REST on its first frame — the pre-slice-2 rise+fade ladder started
     every element at opacity 0 (`ob-boot-in … both`) and produced the black
     first phone frame (critique S-03 / bootreal sheet). The only motion is
     the rung's fill, the stage-word crossfade and the exit, all on
     var(--ob-t-med, 200ms) — the ONE literal duration this sheet carries
     (kit-laws MOTION_OK app.html row: the token fallback at first paint).
     The stage matrix is "show one": the three .ob-boot__row[data-bs] nodes
     stay (the driver's copy fill and the 3G arm read them), only the
     CURRENT stage's row paints. z 60 clears the toolbar (40, the highest
     chrome); on any GENUINE boot error the driver REMOVES the overlay so
     #err (z 9) is never masked. The driver below keeps the shell-arrival
     hold (shell.md §9 entry 22); GH-1061 preserves a delayed foreground
     fade. This style block owns the field's appearance. */
  #ob-boot { position: fixed; inset: 0; z-index: 60; overflow: hidden;
             box-sizing: border-box; padding: max(24px, 5vw);
             display: flex; flex-direction: column; justify-content: center;
             align-items: flex-start; cursor: progress;
             background: var(--ob-bg-0, oklch(13.5% 0.009 165));
             color: var(--ob-text-0, #efe9d8);
             font-family: var(--ob-font, system-ui, sans-serif);
             font-size: var(--ob-fs-0, 14px);
             line-height: var(--ob-lh-body, 1.5); }
  #ob-boot[hidden] { display: none; } /* lesson: pin [hidden] against
             the author display rule (app:// / web-alone serves) */
  #ob-boot.ob-boot--out { opacity: 0; pointer-events: none;
             transition: opacity var(--ob-t-med, 200ms) var(--ob-ease-in, cubic-bezier(0.55, 0, 0.55, 0.2)); }
  /* wordmark: the banner role (fs-3 / semi / tight), sentence case — no
     hero lockup metrics, no caps, no tracking; inside the viewport at 844
     and 1440 in the swap-in fallback font too (e2e-userboot BOOT-FIRSTFRAME) */
  #ob-boot .ob-boot__mark { margin: 0; max-width: 100%;
             font-size: var(--ob-fs-3, 24px);
             font-weight: var(--ob-fw-semi, 620);
             line-height: var(--ob-lh-tight, 1.2);
             letter-spacing: 0; color: var(--ob-text-0, #efe9d8); }
  /* the stage register: ONE rung + the current stage word beside it */
  #ob-boot .ob-boot__stages { display: flex; align-items: center;
             gap: var(--ob-sp-3, 12px); box-sizing: border-box;
             margin: var(--ob-sp-5, 20px) 0 0; width: min(380px, 100%);
             min-height: 24px; }
  /* .ob-progress belt (kit: 6 px border-box pill, --ob-bg-0 well, --ob-line-0
     hairline, fill via transform: scaleX only, t-med) */
  #ob-boot .ob-boot__rung { flex: 1 1 auto; box-sizing: border-box;
             height: 6px; min-width: 120px; position: relative; overflow: hidden;
             border-radius: var(--ob-r-full, 999px);
             background: var(--ob-bg-0, oklch(13.5% 0.009 165));
             border: 1px solid var(--ob-line-0, oklch(97% 0.01 91 / 0.08)); }
  #ob-boot .ob-boot__rung .ob-progress__fill { display: block; height: 100%;
             width: 100%; border-radius: var(--ob-r-full, 999px);
             background: var(--ob-accent, oklch(74% 0.11 252));
             transform-origin: left center; transform: scaleX(0.15);
             transition: transform var(--ob-t-med, 200ms) var(--ob-ease, cubic-bezier(0.22, 1, 0.36, 1)); }
  #ob-boot[data-stage="scene"] .ob-boot__rung .ob-progress__fill { transform: scaleX(0.55); }
  #ob-boot[data-stage="ready"] .ob-boot__rung .ob-progress__fill { transform: scaleX(1); }
  /* stage word: body 14 / semi / text-1, sentence case (boot.kernel /
     boot.scene / boot.ready — no copy change); min-height holds the slot
     while data-i18n text is still empty (the driver fills it once the
     dictionary lands). Show-one matrix: selectors never overlap. */
  #ob-boot .ob-boot__row { display: none; flex: 0 0 auto; margin: 0;
             min-height: 21px; min-width: 1px; white-space: nowrap;
             font-size: var(--ob-fs-0, 14px);
             font-weight: var(--ob-fw-semi, 620);
             line-height: var(--ob-lh-body, 1.5);
             color: var(--ob-text-1, oklch(76% 0.018 91));
             transition: opacity var(--ob-t-med, 200ms) var(--ob-ease, cubic-bezier(0.22, 1, 0.36, 1)); }
  #ob-boot[data-stage="kernel"] .ob-boot__row[data-bs="kernel"],
  #ob-boot[data-stage="scene"] .ob-boot__row[data-bs="scene"],
  #ob-boot[data-stage="ready"] .ob-boot__row[data-bs="ready"] { display: block; }
  /* the stage-word crossfade rides @starting-style on the LATER rows only:
     the first frame (kernel) paints at rest, a stage advance fades the next
     word in over t-med (unsupported engines cut — no motion, no error) */
  @starting-style {
    #ob-boot:not([data-stage="kernel"]) .ob-boot__row { opacity: 0; }
  }
  /* tagline: the body role under the rung (boot.tagline) */
  #ob-boot .ob-boot__tag { margin: var(--ob-sp-2, 8px) 0 0; min-height: 21px;
             font-size: var(--ob-fs-0, 14px);
             font-weight: var(--ob-fw-reg, 430);
             line-height: var(--ob-lh-body, 1.5);
             color: var(--ob-text-1, oklch(76% 0.018 91)); }
  /* GH-694 honest registers (hold law — see the driver note). SLOW: 30 s
     on one stage shows a line under the tagline ("slow connection" copy +
     bytes received) instead of failing open. FAILURE: a fatal condition
     turns the field into a card (title, reason, Retry = reload); the
     field drops UNDER #err (z 8 < 9) so the error log is never masked,
     and the boot guard's body stamp hides the dead chrome skeleton. */
  #ob-boot .ob-boot__slow, #ob-boot .ob-boot__fail { display: none; }
  #ob-boot[data-slow] .ob-boot__slow { display: block; }
  #ob-boot[data-boot-failed] .ob-boot__fail { display: block; }
  #ob-boot[data-boot-failed] .ob-boot__slow { display: none; }
  #ob-boot[data-boot-failed] { z-index: 8; cursor: default; }
  #ob-boot .ob-boot__slow { margin: var(--ob-sp-2, 8px) 0 0; min-height: 21px;
             width: min(380px, 100%); font-size: var(--ob-fs-0, 14px);
             font-weight: var(--ob-fw-reg, 430); line-height: var(--ob-lh-body, 1.5);
             color: var(--ob-text-1, oklch(76% 0.018 91)); }
  #ob-boot .ob-boot__bytes { margin-left: var(--ob-sp-3, 12px);
             color: var(--ob-text-0, #efe9d8); }
  #ob-boot .ob-boot__fail { margin: var(--ob-sp-5, 20px) 0 0;
             width: min(380px, 100%); padding: var(--ob-sp-4, 16px) 0 0;
             border-top: 1px solid var(--ob-danger-line, oklch(66% 0.18 28 / 0.55)); }
  /* title role (fs-1 / semi / text-0), reason in the body role */
  #ob-boot .ob-boot__failtitle { margin: 0 0 var(--ob-sp-1, 4px);
             font-size: var(--ob-fs-1, 16px); line-height: var(--ob-lh-tight, 1.2);
             font-weight: var(--ob-fw-semi, 620); color: var(--ob-text-0, #efe9d8); }
  #ob-boot .ob-boot__reason { margin: 0 0 var(--ob-sp-4, 16px);
             font-size: var(--ob-fs-0, 14px); font-weight: var(--ob-fw-reg, 430);
             line-height: var(--ob-lh-body, 1.5); color: var(--ob-text-1, oklch(76% 0.018 91)); }
  /* Retry: the kit .ob-btn recipe as a belt (control rung 40, sp-4 pad,
     r-full, fs-0 / semi, ivory on the void — this static recovery UI can

    <button id="shoot" class="ob-btn ob-btn--primary" data-i18n="hud.shoot"></button>
    <button id="replay" class="ob-btn" data-i18n="hud.replay" disabled></button>
    <button id="rerack" class="ob-btn" data-i18n="hud.rerack"></button>
  </div>
  <div class="row"><label for="slowmo" data-i18n="hud.slowmo"></label>
    <input id="slowmo" type="checkbox" style="accent-color:var(--ob-accent)"> <span class="val ob-nums">0.25×</span></div>
  <div id="state"></div>
  <div id="rack"></div>
</div>
<div id="help" data-i18n="hud.help"></div>
<script>
/* Boot guard (user-boot black-page fix, 2026-07). A module-graph load
   failure dies BEFORE main.js's error handlers exist — the classic cause is
   heuristic HTTP caching (python -m http.server sends no Cache-Control)
   pairing a revalidated main.js with a STALE cached dependency: the import
   throws a SyntaxError and the page stays black. Self-heal once: re-fetch
   every seen .js AND .css with cache:'reload' (the module loader, <link>,
   and fetch share the HTTP cache), then reload; a repeat failure is
   surfaced in #err instead of a black screen. main.js clears the one-shot
   marker on a healthy boot. CSS joined the heal 2026-07-13 (owner bug: a
   heuristically-cached pre-redesign settings-modal.css against fresh card
   DOM clipped text mid-word + overlapped badges — a heal that refreshes
   only .js CONSTRUCTS that mixed state; the primary defense is the ?v=
   param every stylesheet URL now carries, incl. JS-injected ones). */
(function () {
  var acted = false;
  window.addEventListener('error', function (e) {
    if (window.__test || acted) return; // app is up / heal already running
    // soft dependencies opt out: [data-optional] assets (kit css)
    // degrade by design — a 404 there must not trigger heal-reload cycles
    var tgt = e && e.target;
    if (tgt && tgt.getAttribute && tgt.hasAttribute
        && tgt.hasAttribute('data-optional')) return;
    // nor is a benign notification a load failure (GH-1081; same filter as
    // the #ob-boot driver above: the ResizeObserver-loop text, or the
    // detail-less "Script error." older WebKit censors it to): a heal here
    // restarts the boot, and a second one in the session ends it on BOOT
    // FAILED
    if (e && !e.error
        && (/^ResizeObserver loop (completed with undelivered notifications|limit exceeded)/.test(e.message || '')
          || (e.message === 'Script error.' && !e.filename && !e.lineno))) return;
    acted = true;
    var msg = (e && e.message)
      || ('failed to load ' + ((e && e.target && e.target.src) || 'resource'));
    var err = document.getElementById('err');
    var tried = false;
    try { tried = sessionStorage.getItem('ob-bootfix-attempted') === '1'; } catch (_) {}
    if (tried) {
      // terminal register: the one-shot heal is spent and the graph is
      // still dead. Suppress the never-booted chrome skeleton so only the
      // #err card shows (body[data-ob-boot-failed] rule, style block above).
      document.body.setAttribute('data-ob-boot-failed', '');
      if (err) err.textContent = '[app] BOOT FAILED: ' + msg
        + '\ncache self-heal already attempted; hard-reload (Cmd/Ctrl-Shift-R) or clear site data.';
      return;
    }
    try { sessionStorage.setItem('ob-bootfix-attempted', '1'); } catch (_) {}
    if (err) err.textContent = '[app] boot failed: ' + msg
      + '\nrefreshing cached modules and reloading…';
    var urls = performance.getEntriesByType('resource')
      .map(function (r) { return r.name; })
      .filter(function (u) { return /\.(js|css)($|\?)/.test(u); });
    urls.push(location.href);
    Promise.allSettled(urls.map(function (u) { return fetch(u, { cache: 'reload' }); }))
      .then(function () { location.reload(); });
  }, true); // capture: window-level runtime errors AND element load errors
})();
</script>
<script>
/* Service-worker registration (branch pwa-standalone). Classic inline
   script on the boot-guard pattern: zero import edges (the ownership ledger rule 5
   corollary), feature-detected, failures SILENT — no SW support (WKWebView,
   http:// LAN serves outside the localhost secure context) degrades to the
   plain network app, never a console error or a boot difference. './sw.js'
   resolves against THIS document, so the scope is the web/ dir in every
   serving layout. Registration waits for window load: the SW precache
   (sw.js) must never compete with the boot module graph for the network.
   sw.js versions its cache and the browser's own update cycle installs the
   next snapshot in the background, where it WAITS (stale-but-CONSISTENT
   beats fresh-but-mixed: the cache-poison doctrine). GH-1047: once
   registered, app/swupdate.js (a guarded import — no file or offline = no
   notice) offers the waiting generation's Reload; every controlled page
   reloads at its controllerchange (the listener below, outside that
   import), so none runs two generations.
   AUTOMATION SUPPRESSION (?sw= overrides): the e2e battery drives ONE
   browser profile through many boots and simulates stale-graph degradation
   by intercepting module fetches at the NETWORK layer (e2e-ui H11,
   e2e-settings stale-navmodal, e2e-userboot poisoned settings.js — 15
   Fetch-intercept arms across 8 suites); a controlling SW answers those
   URLs cache-first, the request never reaches the network stack, and the
   arm's stub can never land (observed red on e2e-ui H11). Suites test the
   APP's degradation laws, not SW freshness, so navigator.webdriver boots
   default to NO registration; ?sw=1 forces it (PWA/offline validation
   drives exactly this), ?sw=0 forces it off for a real-browser debug.
   The OFF path also EXITS existing control (review r3 P2): skipping
   registration alone leaves an already-controlling worker serving its
   snapshot — the documented opt-out could never actually disable caching,
   and local dev stayed pinned to pre-edit files after one normal load.
   While this page is CONTROLLED, unregister the page's registration and
   reload once; the reloaded page has no controller (the registration is
   gone), so the controller guard makes a loop impossible. Caches are left
   in place deliberately — opt-out exits CONTROL; a later opted-in load
   re-registers and installs/reuses a generation as usual. */
(function () {
  if (!('serviceWorker' in navigator)) return;
  var on = true;
  try {
    var q = new URLSearchParams(location.search);
    if (q.get('sw') === '0') on = false;
    else if (q.get('sw') !== '1' && navigator.webdriver) on = false;
  } catch (e) { /* malformed URL — keep the default */ }
  if (!on) {
    try {
      if (!navigator.serviceWorker.controller) return; // already free
      navigator.serviceWorker.getRegistration().then(function (reg) {
        return reg ? reg.unregister() : false;
      }).then(function (did) {
        // reload ONCE, only while still controlled — post-unregister
        // loads have no controller, so this branch cannot re-fire
        if (did && navigator.serviceWorker.controller) location.reload();
      }).catch(function () { /* silent — degradation law */ });
    } catch (e) { /* silent — degradation law */ }
    return;
  }
  // GH-1047: a newer generation took control (the update notice's
  // Reload, in this tab or another): reload at once, inert meanwhile, so no
  // page keeps running the old generation's modules over the new snapshot.
  // Registered here, before any module runs; a page that was never
  // controlled sees no change (the worker never claims clients).
  var wasControlled = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!wasControlled || window.__obSwReloading) return;
    window.__obSwReloading = true;
    try { document.body.inert = true; } catch (e) { /* engine without inert */ }
    location.reload();
  });
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').then(function (reg) {
      return import('./app/swupdate.js').then(function (m) {
        if (typeof m.watchUpdates === 'function') m.watchUpdates(reg);
      });
    }).catch(function () {});
    // GH-714 review r4 P2: every loaded page re-arms the background fill
    // (the worker kicks inside the message's waitUntil, or no-ops while a
    // kick is in flight): a worker the browser stopped before its fill
    // turns finished resumes from here even without a fetch event.
    // `ready` resolves for an uncontrolled first visit too (no claim).
    navigator.serviceWorker.ready.then(function (r) { if (r.active) r.active.postMessage({ ob: 'fill', why: 'client' }); }).catch(function () {});
  });
})();
</script>
<script type="module" src="./app/main.js"></script>
</body>
</html>
