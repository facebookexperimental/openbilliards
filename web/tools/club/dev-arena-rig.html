<script type="module">
import * as THREE from 'three';
import { RectAreaLightUniformsLib } from '../../vendor/jsm/lights/RectAreaLightUniformsLib.js';
import { roomLight } from '../../scene/club/room/light.js';
import * as LAYOUT from '../../scene/club/arena/layout.js';
import { buildRig } from '../../scene/club/arena/rig.js';
import { floodPlan, keyPlan } from '../../scene/club/arena/rig/plan.js';

const { ARENA, PALETTE } = LAYOUT;
const q = new URLSearchParams(location.search);
RectAreaLightUniformsLib.init();
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85; // the tournament look's exposure
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x010101);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 80);

const VIEWS = Object.fromEntries(LAYOUT.VIEWS.map((v) => [v.id, [v.cam, v.target, v.fov]]));
Object.assign(VIEWS, {
  under: [[-1.9, 0.5, 0.5], [0.2, 0.95, 0], 50],
  up: [[0.25, 0.12, 0.12], [0.05, 1.02, 0], 62],
  look: [[-2.4, 0.55, 1.2], [0, 0.85, 0], 45],
  truss: [[-3.5, 1.9, 2.7], [-2.1, 2.6, 1.1], 30],
  head: [[0.1, 1.75, -0.35], [0.65, 2.72, 1.0], 32],
  corner: [[-3.6, 2.2, 2.4], [-2.45, 3.4, 1.35], 42],
  rig: [[-6.2, 1.5, 5.2], [0.3, 1.9, 0], 52],
  roof: [[-4.2, 0.95, 2.8], [7, 6.2, -6], 50],
  hi: [[-5.2, 3.0, 3.4], [0, 0.3, 0], 40],
  // round A2: the perimeter truss's far corner from the wide pose's eye; the perimeter truss close (a place the app's camera
  // cannot be: inspection only); the two rectangles from outside the island; the roof steel from the island's edge;
  // the bed looking up (the housing's underside as the app can see it); straight up from the cloth
  per: [[-4.2, 0.95, 2.8], [8, 3.4, -8], 30],
  ptruss: [[3.5, 2.2, -6.2], [7.5, 4.6, -10], 46], // (below the hall's top cut: above it the rig is not drawn)
  outer: [[-6.0, 1.1, 4.6], [0.6, 3.1, -0.8], 48],
  steel: [[-5.0, 1.2, 3.9], [9, 8.2, -9], 44],
  bed: [[-1.05, 0.2, 0.5], [0.15, 1.05, -0.05], 58],
  // round A4: a house flood on its drop pipe (from below and outside: its lit face), the same flood from the side with
  // the roof truss it hangs from, the east floods under their rigging beams, a key light's profile spot under the
  // perimeter truss, and the outer rectangle's washes on standby (dark lenses) with the floods behind them
  // (every eye below the hall's top cut, 2.45 m over the bed plane: above it the rig is not drawn)
  flood: [[1.9, 2.3, -6.6], [2.8, 5.0, -3.6], 26],
  floodside: [[-0.4, 2.3, -5.4], [2.8, 5.2, -3.6], 40],
  efloods: [[7.6, 2.3, -0.6], [4.9, 5.2, 0], 50],
  keyspot: [[0.0, 2.3, -7.6], [1.13, 4.13, -9.77], 24], // (round A5: the north key moved to x = 1.13)
  standby: [[-1.0, 2.2, -5.6], [2.35, 3.1, -3.0], 40],
  // (round A4's `battens` and `battensback`: the wall washers are gone in round A5; the names stay as poses of the
  // north run's outer chord, where nothing hangs now)
  battens: [[4.6, 2.2, -12.2], [1.6, 4.8, -10.39], 40],
  battensback: [[0.2, 2.3, -7.4], [1.6, 4.8, -10.39], 34],
  // ROUND A5 (CONTRACT 17.4, 17.1): a lit screen square on from the island's north edge; two screens and the cans
  // between them from the wide pose's eye; the roof's bells from the island (their lit mouths inside black bells); a
  // can of the ring from below and beside; a flood's LED face from the rows it lights; the heads' lenses from below
  screen: [[-3.2, 1.2, -3.6], [-4.4, 4.09, -9.6], 26],
  screens: [[-4.2, 0.95, 2.8], [0.2, 4.1, -9.7], 22],
  bells: [[-3.0, 0.9, 2.4], [3.0, 6.9, -5.0], 40],
  cans: [[-1.0, 1.4, -6.4], [1.63, 4.1, -10.0], 30],
  floodface: [[2.2, 1.6, -8.4], [2.8, 5.0, -3.6], 22],
  lenses: [[-3.4, 0.9, 2.6], [-0.6, 2.7, 0.9], 30],
});
function pose([pos, tgt, fov]) { camera.position.set(...pos); camera.fov = fov; camera.updateProjectionMatrix(); camera.lookAt(...tgt); camera.updateMatrixWorld(true); }
let start = VIEWS[q.get('view')] ?? VIEWS.V10;
if (q.get('cam')) { const c = q.get('cam').split(',').map(Number); start = [c.slice(0, 3), c.slice(3, 6), c[6] ?? 40]; }
pose(start);

// ---- the stand-in hall (the hall role's part): a dark box of the layout's size, carpet with a lighter island, a ring of
// boards with a lit rail (the surround role's part), all lit as the room light lights its own materials
const FLOOR_Y = -0.79, H = ARENA.hall;
const box = { min: new THREE.Vector3(H.x0, FLOOR_Y, H.z0), max: new THREE.Vector3(H.x1, FLOOR_Y + H.height, H.z1) };
const detail = [0, 1, 2].includes(Number(q.get('tier'))) && q.get('tier') !== null ? Number(q.get('tier')) : 2;
const frameFns = [];
const club = {
  enabled: true, venue: 'arena', tier: ['lite', 'base', 'high'][detail], knobs: { roomDetail: detail }, time: { value: 0 },
  ctx: { renderer, scene, camera, query: new URLSearchParams([...q].map(([k, v]) => (k === 'parts' ? ['clubrig', v] : k === 'rig' && v === 'off' ? ['clubrig', 'off'] : [k, v]))), room: null, table: null },
  onFrame(fn) { if (!frameFns.includes(fn)) frameFns.push(fn); }, offFrame(fn) { const i = frameFns.indexOf(fn); if (i >= 0) frameFns.splice(i, 1); },
};
roomLight.reset();
// (rounds A3 and A4: as arena/room.js inits the room light: the table's shadow under the emitters, and a CONE for a point
// emitter: without the switch the heads, the house floods and the keys were broad lobes on this page)
roomLight.init({ club, envMap: null, tableBlock: true, cone: true });
roomLight.setBox(box.min, box.max);
// round A4: the hall's own ambient rows (arena/layout.js LIGHT: the roof's bells and the ring's cans, lit: 0.6 units on an
// open floor, 1.0 on an open vertical face); `?amb=0` gives the dark hall of rounds A1 to A3 back (an off arm)
{
  const L4 = LAYOUT.LIGHT ?? {}, dark = q.get('amb') === '0';
  const row = (v, d) => new THREE.Color(...(dark || !Array.isArray(v) ? d : v));
  roomLight.setAmbient(row(L4.ambientSky, [0.05, 0.05, 0.055]), row(L4.ambientGround, [0.02, 0.02, 0.022]), row(L4.ambientSide, [0.035, 0.035, 0.04]));
}
if (typeof roomLight.setSides === 'function' && typeof LAYOUT.cutPlanes === 'function') roomLight.setSides(LAYOUT.cutPlanes(FLOOR_Y));
const carpetMat = roomLight.material({ color: PALETTE.carpet, roughness: 0.96, name: 'dev.carpet' });
const islandMat = roomLight.material({ color: PALETTE.island, roughness: 0.94, name: 'dev.island' });
const drapeMat = roomLight.material({ color: 0x0c0c0e, roughness: 0.97, name: 'dev.drape' });
const roofMat = roomLight.material({ color: 0x18191b, roughness: 0.9, name: 'dev.roof' });
const boardMat = roomLight.material({ color: PALETTE.board, roughness: 0.5, name: 'dev.board' });
const W = H.x1 - H.x0, D = H.z1 - H.z0, cx = (H.x1 + H.x0) / 2, cz = (H.z1 + H.z0) / 2;
const roomGroup = new THREE.Group(); roomGroup.name = 'devHall'; scene.add(roomGroup);
club.room = { enabled: true, group: roomGroup };
const addPlane = (w, h, mat, pos, rot) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat); m.position.set(...pos); m.rotation.set(...rot); roomGroup.add(m); return m; };
const floor = addPlane(W, D, carpetMat, [cx, FLOOR_Y, cz], [-Math.PI / 2, 0, 0]);
const I = ARENA.island;
addPlane(I.x1 - I.x0, I.z1 - I.z0, islandMat, [(I.x0 + I.x1) / 2, FLOOR_Y + 0.004, (I.z0 + I.z1) / 2], [-Math.PI / 2, 0, 0]);
addPlane(W, D, roofMat, [cx, FLOOR_Y + H.height, cz], [Math.PI / 2, 0, 0]);
addPlane(W, H.height, drapeMat, [cx, FLOOR_Y + H.height / 2, H.z0], [0, 0, 0]);
addPlane(W, H.height, drapeMat, [cx, FLOOR_Y + H.height / 2, H.z1], [0, Math.PI, 0]);
addPlane(D, H.height, drapeMat, [H.x0, FLOOR_Y + H.height / 2, cz], [0, Math.PI / 2, 0]);
addPlane(D, H.height, drapeMat, [H.x1, FLOOR_Y + H.height / 2, cz], [0, -Math.PI / 2, 0]);
if (q.get('boards') !== '0') {
  const B = ARENA.boards, railMat = roomLight.emissive({ color: new THREE.Color(PALETTE.rail), intensity: 2.2, name: 'dev.rail' });
  const side = (sx, sz, px, pz) => {
    const b = new THREE.Mesh(new THREE.BoxGeometry(sx, B.height, sz), boardMat); b.position.set(px, FLOOR_Y + B.height / 2, pz); roomGroup.add(b);
    const r = new THREE.Mesh(new THREE.BoxGeometry(sx, B.rail.height, sz * 0.5), railMat); r.position.set(px, FLOOR_Y + B.height + B.rail.height / 2, pz); roomGroup.add(r);
  };
  side(I.x1 - I.x0, B.thickness, 0, I.z0); side(I.x1 - I.x0, B.thickness, 0, I.z1); side(B.thickness, I.z1 - I.z0, I.x1, 0);
  // stand-in seating behind the boards: three dark steps per side (so the far field is not an empty wall)
  const seatMat = roomLight.material({ color: PALETTE.seat, roughness: 0.7, name: 'dev.seat' });
  for (let r = 0; r < ARENA.seating.rows; r++) {
    const off = ARENA.seating.front + r * ARENA.seating.tread, h = ARENA.seating.firstRowH + r * ARENA.seating.rise;
    for (const s of [-1, 1]) { const m = new THREE.Mesh(new THREE.BoxGeometry(I.x1 - I.x0, 0.08, ARENA.seating.tread * 0.6), seatMat); m.position.set(0, FLOOR_Y + h, s * (I.z1 + off + ARENA.seating.tread / 2)); roomGroup.add(m); }
    const e = new THREE.Mesh(new THREE.BoxGeometry(ARENA.seating.tread * 0.6, 0.08, I.z1 - I.z0), seatMat); e.position.set(I.x1 + off + ARENA.seating.tread / 2, FLOOR_Y + h, 0); roomGroup.add(e);
  }
}

// ---- the stand-in table (the cloth carries the app's class tag, so the rig reads the bed from it) and a few balls
const table = new THREE.Group();
const clothMat = new THREE.MeshStandardMaterial({ color: 0x2a6fd0, roughness: 0.92 });
clothMat.userData.obClass = 'cloth';
const cloth = new THREE.Mesh(new THREE.BoxGeometry(2.62, 0.02, 1.35), clothMat); cloth.position.y = -0.01; table.add(cloth);
const railMat = new THREE.MeshStandardMaterial({ color: 0x0c0c0c, roughness: 0.22 }), bodyMat = new THREE.MeshStandardMaterial({ color: 0x15110e, roughness: 0.7, envMapIntensity: 0.3 });
for (const [sx, sz, px, pz] of [[2.94, 0.16, 0, 0.755], [2.94, 0.16, 0, -0.755], [0.16, 1.35, 1.39, 0], [0.16, 1.35, -1.39, 0]]) {
  const r = new THREE.Mesh(new THREE.BoxGeometry(sx, 0.07, sz), railMat); r.position.set(px, 0.005, pz); table.add(r);
}
const body = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.3, 1.5), bodyMat); body.position.y = -0.19; table.add(body);
for (const [lx, lz] of [[-1.15, -0.55], [1.15, -0.55], [-1.15, 0.55], [1.15, 0.55]]) { const leg = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.46, 0.16), bodyMat); leg.position.set(lx, -0.56, lz); table.add(leg); }
const ballGeo = new THREE.SphereGeometry(0.028575, 48, 32);
[[-0.55, 0.1, 0xf4f1e6], [0.05, -0.05, 0xe2b400], [0.42, 0.28, 0x1b3fb0], [0.7, -0.38, 0xb01818], [-0.15, -0.25, 0x101010], [1.05, 0.52, 0x0c6e3a], [0.95, 0.02, 0xd05a10]].forEach(([x, z, c]) => {
  const b = new THREE.Mesh(ballGeo, new THREE.MeshStandardMaterial({ color: c, roughness: 0.06, envMapIntensity: 1 })); b.position.set(x, 0.028575, z); table.add(b);
});
scene.add(table);
club.ctx.table = { group: table };
const tableBounds = { minX: -1.47 - 1.55, maxX: 1.47 + 1.55, minZ: -0.835 - 1.55, maxZ: 0.835 + 1.55 };

// ---- the stand-in app room: the lights and the luminaire meshes as the app builds them (web/scene/room.js, lightingvisuals.js)
const IN = 0.0254, APP_CEIL = FLOOR_Y + 3.24;
const FIXTURES = {
  canopy: { emitters: [{ x: 0, z: 0, y: 1.02, w: 2.05, d: 0.66 }], face: [10, 9, 7.1], intensity: 7.6, color: 0xfff1da },
  pendant: { emitters: [-0.55, 0, 0.55].map((x) => ({ x, z: 0, y: 0.90, w: 0.26, d: 0.26 })), face: [9, 6.5, 4.1], intensity: 7.6 * 20.5, color: 0xffb875 },
  strip: { emitters: [{ x: 0, z: 0, y: 1.15, w: 2.984, d: 0.20 }], face: [10, 9.8, 9.5], intensity: 7.6 * 7, color: 0xfdf9f2 },
  carom: { emitters: [{ x: 0, z: 0, y: 1.02, w: 2.60, d: 0.35 }], face: [10, 9.7, 9.4], intensity: 7.6 * 2.74, color: 0xfaf7f0 },
  ring: { emitters: (() => { const ow = 102.4 * IN, od = 53 * IN, sw = 2.75 * IN, y = 45 * IN; return [
    { x: 0, z: -(od - sw) / 2, y, w: ow - 2 * sw, d: sw }, { x: 0, z: (od - sw) / 2, y, w: ow - 2 * sw, d: sw },
    { x: -(ow - sw) / 2, z: 0, y, w: sw, d: od }, { x: (ow - sw) / 2, z: 0, y, w: sw, d: od }]; })(), face: [11, 10.3, 9.2], intensity: 7.6 * 14.4, color: 0xffeed6 },
};
const fx = FIXTURES[q.get('fixture')] ?? FIXTURES.canopy;
const appGroup = new THREE.Group(); scene.add(appGroup);
const rectLights = fx.emitters.map((e) => { const l = new THREE.RectAreaLight(fx.color, fx.intensity, e.w, e.d); l.position.set(e.x, e.y, e.z); l.lookAt(e.x, 0, e.z); appGroup.add(l); return l; });
appGroup.add(new THREE.HemisphereLight(0x38301f, 0x1c2a1c, 0.22));
const fill = new THREE.PointLight(0xffdcae, 2.2, 0, 2); fill.position.set(3.2, 1.9, -2.3); appGroup.add(fill);
const e0 = fx.emitters[0];
const lampFace = new THREE.Mesh(new THREE.PlaneGeometry(e0.w, e0.d), new THREE.MeshBasicMaterial({ color: new THREE.Color(...fx.face) }));
lampFace.rotation.x = Math.PI / 2; lampFace.position.set(e0.x, e0.y, e0.z); appGroup.add(lampFace);
const hood = new THREE.Mesh(new THREE.BoxGeometry(e0.w + 0.14, 0.10, e0.d + 0.14), new THREE.MeshStandardMaterial({ color: 0x142014, roughness: 0.45, metalness: 0.25 }));
hood.position.set(e0.x, e0.y + 0.055, e0.z); appGroup.add(hood);
const rods = [-0.75, 0.75].map((rx) => { const r = new THREE.Mesh(new THREE.CylinderGeometry(0.007, 0.007, APP_CEIL - (e0.y + 0.14), 10), new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.4, metalness: 0.7 })); r.position.set(rx, (APP_CEIL + e0.y + 0.14) / 2, 0); appGroup.add(r); return r; });
if (fx !== FIXTURES.canopy) {
  for (const o of [lampFace, hood, ...rods]) o.visible = false;
  const fixtureGroup = new THREE.Group(); appGroup.add(fixtureGroup);
  const fxMeshes = [];
  for (const e of fx.emitters) {
    const face = new THREE.Mesh(new THREE.PlaneGeometry(e.w, e.d), new THREE.MeshBasicMaterial({ color: new THREE.Color(...fx.face) }));
    face.rotation.x = Math.PI / 2; face.position.set(e.x, e.y, e.z); fixtureGroup.add(face); fxMeshes.push(face);
    const house = new THREE.Mesh(new THREE.BoxGeometry(e.w + 0.06, 0.08, e.d + 0.06), new THREE.MeshStandardMaterial({ color: 0x202020, roughness: 0.5 }));
    house.position.set(e.x, e.y + 0.045, e.z); fixtureGroup.add(house); fxMeshes.push(house);
  }
  window.__lighting = { fixtureMeshes: () => fxMeshes, state: () => ({ brightness: 1 }) };
}
const appRoom = { group: appGroup, rectLight: rectLights[0], lightRefs: { group: appGroup, rectLights, lampFace, hood, rods, floor, fill } };
club.ctx.room = appRoom;
// the lit table as an upward emitter and the table's shadow on the carpet, as the hall will set them
roomLight.addEmitter({ id: 'room.bounce.table', type: 'rect', position: new THREE.Vector3(0, 0.035, 0), normal: new THREE.Vector3(0, 1, 0), axis: new THREE.Vector3(1, 0, 0), size: [2.5, 1.25], color: new THREE.Color(0.75, 0.83, 1.0), intensity: 0.16, radius: 5.5 });
roomLight.setShadow({ lamp: { cx: 0, cz: 0, hx: 1.02, hz: 0.33 }, table: { cx: 0, cz: 0, hx: 1.47, hz: 0.835 }, lampY: 1.02, tableY: 0.035, ambient: 0.32, strength: 1 });

// ---- the rig
// (round A4: `spill: false`, as the room builds it: the luminaire's band is no run-time emitter of the arena)
const rig = await buildRig(club, { box, floorY: FLOOR_Y, tableBounds, roomLight, appRoom, layout: ARENA, spill: false });
roomGroup.add(rig.group);
// round A4: the six house floods as the room registers them (arena/room.js HOUSE; the plan's places and levels), so the
// page's seats-free stand-in hall is lit as the hall is; `?floods=0` leaves them out (an off arm). The three keys are
// bake-only in the app; `?keys=1` registers them here to see their beams on the carpet.
{
  const add = (e, k = 1) => roomLight.addEmitter({ id: e.id, type: e.type, position: new THREE.Vector3(...e.position), normal: null, axis: new THREE.Vector3(...e.axis), size: e.size.slice(), color: new THREE.Color(...e.color), intensity: e.intensity * k, radius: e.radius, cone: e.cone, bell: e.bell === true });
  if (q.get('floods') !== '0') for (const e of floodPlan(ARENA, { floorY: FLOOR_Y }).emitters) add(e);
  if (q.get('keys') === '1') { const ky = keyPlan(ARENA, { floorY: FLOOR_Y }); for (const [id, at] of Object.entries(ky.at)) add({ id: `key.${id}`, type: 'point', position: at.position, axis: at.axis, size: [0.45, 1], color: [1.0, 0.95, 0.86], intensity: 80, radius: 40, cone: 17, bell: true }); }
}
if (q.get('wash') === '0') for (const e of roomLight.emitters ?? []) if (String(e.id).startsWith('rig.head.')) e.intensity = 0;
roomLight.commit();
if (q.get('force')) rig.force?.(q.get('force'));
window.__rig = rig; window.__dev = { THREE, renderer, scene, camera, club, appRoom, roomLight };
// numbers for the report: the room light's irradiance (emitters and ambient, no three light) on the carpet at a few points
// and on the truss's underside, in the app's light units
window.__probe = () => {
  const at = (p, n) => roomLight.irradianceAt(p, n, { baked: false }).map((v) => Math.round(v * 1000) / 1000);
  const up = [0, 1, 0], down = [0, -1, 0];
  return {
    carpet: Object.fromEntries([[0, 1.9], [0, 2.6], [0, 3.6], [2.2, 1.9], [3.6, 0], [4.8, 0], [4.8, 3.6], [0, 0]].map(([x, z]) => [`${x},${z}`, at([x, FLOOR_Y + 0.01, z], up)])),
    trussUnder: { mid: at([0, FLOOR_Y + ARENA.rig.bottomH, 1.355], down), corner: at([2.4, FLOOR_Y + ARENA.rig.bottomH, 1.355], down) },
    housingTop: at([0, 1.16, 0], up),
    emitters: (roomLight.emitters ?? []).map((e) => [e.id, e.type, e.intensity]),
  };
};

// ---- the environment cube, captured from just above the cloth as the app does (the rig leaves the lamp in a cube render to
// the app: the stand-in app luminaire is what it holds, with the truss, the heads and the house lights around it)
const cubeRT = new THREE.WebGLCubeRenderTarget(256, { type: THREE.HalfFloatType, generateMipmaps: true, minFilter: THREE.LinearMipmapLinearFilter });
const cubeCam = new THREE.CubeCamera(0.02, 60, cubeRT);
cubeCam.position.set(0, 0.115, 0); scene.add(cubeCam);
const bake = () => { cubeCam.update(renderer, scene); scene.environment = cubeRT.texture; roomLight.setEnvMap(cubeRT.texture); };
for (const fn of [...frameFns]) fn(0, 0);
rig.update(camera, 0);
bake(); bake();

// ---- ?cube=1: the environment cube's upward face as an inset at the upper right
let cubeInset = null;
if (q.get('cube') === '1') {
  const rt = new THREE.WebGLCubeRenderTarget(512, { type: THREE.HalfFloatType });
  const probe = new THREE.CubeCamera(0.02, 60, rt); probe.position.copy(cubeCam.position); scene.add(probe);
  const insetScene = new THREE.Scene(), insetCam = new THREE.PerspectiveCamera(100, 1, 0.01, 10);
  insetCam.up.set(1, 0, 0); insetCam.lookAt(0, 1, 0);
  insetScene.background = rt.texture;
  cubeInset = { draw() {
    probe.update(renderer, scene);
    const w = renderer.domElement.width, h = renderer.domElement.height, s = Math.round(h * 0.6);
    const autoClear = renderer.autoClear;
    renderer.autoClear = false;
    renderer.setViewport(w - s - 12, h - s - 12, s, s); renderer.setScissor(w - s - 12, h - s - 12, s, s); renderer.setScissorTest(true);
    renderer.clearDepth();
    renderer.render(insetScene, insetCam);
    renderer.setScissorTest(false); renderer.setViewport(0, 0, w, h);
    renderer.autoClear = autoClear;
  } };
}

const label = document.getElementById('label');
if (q.get('label') === '0') label.style.display = 'none';
const show = () => {
  const s = rig.state?.() ?? {}; const c = rig.counts?.() ?? {};
  label.textContent = rig.enabled ? `rig tier ${s.detail}  housing ${s.kind} ${s.state}${s.reason ? ` (${s.reason})` : ''}  fade ${Number(s.fade).toFixed(2)}  cover ${s.cover?.tight}/${s.cover?.visible}  in frame ${s.whole?.inFrame} of frame ${s.whole?.ofFrame}  eye y ${camera.position.y.toFixed(2)}\n`
    + `${c.drawCalls} draws (${c.drawn} now) ${c.triangles} tris  emitters ${c.emitters}/${s.emitters?.share}  patched ${s.patches?.done?.length} missed ${s.patches?.missed?.length}  programs ${s.hook?.programs}  cube renders ${s.hook?.cubeRenders}  keep-out ${s.keepOut?.ok ? 'ok' : 'FAIL'} (${s.keepOut?.clearance} m)  renderer ${renderer.info.render.calls} calls ${renderer.info.render.triangles} tris`
    : `rig off (${rig.reason}): the stand-in app luminaire`;
};

let frames = 0, clock = 0;
let quad = (q.get('quad') ?? '').split(',').map((k) => VIEWS[k.trim()]).filter(Boolean).slice(0, 4);
let quadNames = (q.get('quad') ?? '').split(',');
window.__quad = [];
// ?pair=: the cells are [view a as built, view a switched, view b as built, view b switched]
const pairName = q.get('pair');
const headEmitters = () => (roomLight.emitters ?? []).filter((e) => String(e.id).startsWith('rig.head.'));
const washLevel = headEmitters()[0]?.intensity ?? 0;
const PAIRS = {
  parts: (on) => rig.set?.({ parts: { truss: on, lens: on, house: on } }),
  truss: (on) => rig.set?.({ parts: { truss: on } }),
  lens: (on) => rig.set?.({ parts: { lens: on } }),
  house: (on) => rig.set?.({ parts: { house: on } }),
  steel: (on) => rig.set?.({ wash: on }),
  haze: (on) => rig.set?.({ haze: on }),
  wash: (on) => { for (const e of headEmitters()) e.intensity = on ? washLevel : 0; roomLight.commit(); },
  housing: (on) => rig.force?.(on ? null : 'absent'),
  tier0: (on) => rig.setTier?.(on ? club.tier : 'lite'),
  tier1: (on) => rig.setTier?.(on ? club.tier : 'base'),
};
const pairSwitch = PAIRS[pairName] ?? null;
if (pairSwitch) {
  const names = (q.get('views') ?? 'V10,rig').split(',').map((k) => k.trim()).filter((k) => VIEWS[k]).slice(0, 2);
  quad = names.flatMap((k) => [VIEWS[k], VIEWS[k]]);
  quadNames = names.flatMap((k) => [k, `${k} without ${pairName}`]);
}
function frame() {
  const dt = 1 / 60; clock += dt; club.time.value = clock;
  if (quad.length) {
    // four poses in one frame: each is its own tick and its own cut (the housing's state is a pure function of the pose)
    const w = renderer.domElement.width, h = renderer.domElement.height, states = [];
    renderer.setScissorTest(true);
    quad.forEach((v, i) => {
      const x = (i % 2) * (w / 2), y = (i < 2 ? 1 : 0) * (h / 2);
      renderer.setViewport(x, y, w / 2, h / 2); renderer.setScissor(x, y, w / 2, h / 2);
      if (pairSwitch) pairSwitch(i % 2 === 0);
      pose(v);
      for (const fn of [...frameFns]) fn(clock, dt);
      rig.update(camera, dt);
      renderer.render(scene, camera);
      const s = rig.state?.() ?? {};
      states.push({ state: s.state ?? null, reason: s.reason ?? null, calls: renderer.info.render.calls, triangles: renderer.info.render.triangles });
    });
    renderer.setScissorTest(false); renderer.setViewport(0, 0, w, h);
    window.__quad = states;
    if (pairSwitch) pairSwitch(true);
    label.textContent = states.map((s, i) => `${quadNames[i]}: ${s.state}${s.reason ? ` (${s.reason})` : ''} ${s.calls} calls ${s.triangles} tris`).join('   ');
    if (++frames === 6) window.__ready = true;
    return;
  }
  for (const fn of [...frameFns]) fn(clock, dt);
  rig.update(camera, dt);
  renderer.render(scene, camera);
  if (frames === 0) window.__info = { calls: renderer.info.render.calls, triangles: renderer.info.render.triangles, programs: renderer.info.programs?.length ?? null };
  cubeInset?.draw();
  frames += 1;
  show();
  if (frames === 6) window.__ready = true;
}
renderer.setAnimationLoop(frame);
</script>
</body>
</html>
