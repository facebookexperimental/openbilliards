  pairViews.forEach((id, row) => {
    pose(id, w, h);
    for (const fn of [...frameFns]) fn(t, 1 / 60);
    for (const [col, on] of [[0, true], [1, false]]) {
      pairSwitch(on);
      const x = col * w, y = (1 - row) * h;
      renderer.setViewport(x, y, w, h); renderer.setScissor(x, y, w, h);
      renderer.render(scene, camera);
    }
    pairSwitch(true);
  });
  renderer.setScissorTest(false);
};
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  if (!QUAD.length && !PAIR) for (const fn of [...frameFns]) fn(t, 1 / 60);
  if (PAIR) renderPair(t); else if (QUAD.length) renderQuad(t); else renderer.render(scene, camera);
  if (++frames === 4) {
    window.__dev.info = { calls: renderer.info.render.calls, triangles: renderer.info.render.triangles, programs: renderer.info.programs?.length ?? 0, textures: renderer.info.memory.textures, geometries: renderer.info.memory.geometries };
    window.__ready = true;
  }
});
</script>
