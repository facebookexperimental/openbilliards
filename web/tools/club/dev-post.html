// ---- the tap proof (GH-329): the screen, the accumulator's export frame and the ink sampler's tap must be one image ---------
const grab = () => {

  const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(renderer.domElement, 0, 0, 320, 180);

    output.renderToScreen = true; output.render(renderer, null, composer.readBuffer); output.renderToScreen = rts;
    out.control_wrongBuffer = diff(screen, grab());        // sensitivity: the OTHER buffer is not the frame
    const s0 = post.grade.strength; post.grade.strength = 0; composer.render();
    out.control_gradeOff = diff(screen, grab());           // sensitivity: the grade is in the picture
    post.grade.strength = s0;
    // the fold: the app's falloff inside the grade's draw against the two as separate passes (round 1's chain), whole frame
    {
      const full = (a, b) => { let sum = 0, max = 0, over1 = 0; for (let i = 0; i < a.length; i += 4) { const m = Math.max(Math.abs(a[i] - b[i]), Math.abs(a[i + 1] - b[i + 1]), Math.abs(a[i + 2] - b[i + 2])); sum += m; if (m > max) max = m; if (m > 1) over1 += 1; } return { mean: +(sum / (a.length / 4)).toFixed(4), max, over1 }; };
      composer.render(); composer.render();
      const folded = fullGrab(), wasFolded = post.falloff.folded, listFolded = post.counts().passes.list.join(' > ');
      post.falloff.folded = false; composer.render(); composer.render();
      out.fold = { folded: wasFolded, list: listFolded, unfoldedList: post.counts().passes.list.join(' > '), unfolded_vs_folded: full(folded, fullGrab()) };
      post.falloff.folded = true; composer.render(); composer.render();
      out.fold.backToFolded = full(folded, fullGrab());
    }

    // the app's own accumulation lens (main.js renderAccum with opts.dof, reproduced here step for step: frame hooks, then the
    // eye on a golden-spiral aperture disc re-aimed at the focus depth on the view axis, then one accumulator sub-frame, then
    // the pose restored). The club lens must stand down for exactly those sub-frames and be back on the next plain frame.

// ---- the readability proof: the lens's own numbers per class of pixel, and the picture with the lens on against off ------------
const fullGrab = () => {

const frameNow = (dt = 0) => { clock += dt; for (const fn of [...frameFns]) fn(clock, dt); composer.render(); };
function probeRun() {
  if (!post.enabled || !post.dof?.enabled) return { ok: false, reason: 'no lens on this tier' };
  const NAMES = ['outside', 'bed', 'ball', 'cushion', 'pocket', 'rail'];
  frameNow(); frameNow();
  const on = fullGrab();
  const frameOn = post.counts().frame;
  const p = post.dof.probe({ mask: true });
  if (!p.ok) return p;
  const mask = p.mask; delete p.mask;
  const ap = post.dof.aperture; post.dof.aperture = 0; frameNow(); frameNow();
  const off = fullGrab();
  const activeOff = post.counts().frame.active.join(',');
  post.dof.aperture = ap; frameNow(); frameNow();
  const back = fullGrab();
  // the picture, lens on against lens off, per class (8-bit levels; the largest channel difference of a pixel)
  const d = NAMES.map(() => ({ px: 0, max: 0, sum: 0, over1: 0 }));
  let again = 0;
  for (let i = 0, k = 0; i < mask.length; i++, k += 4) {
    const m = Math.max(Math.abs(on[k] - off[k]), Math.abs(on[k + 1] - off[k + 1]), Math.abs(on[k + 2] - off[k + 2]));
    const c = d[mask[i]]; c.px += 1; c.sum += m; if (m > c.max) c.max = m; if (m > 1) c.over1 += 1;
    again = Math.max(again, Math.abs(on[k] - back[k]), Math.abs(on[k + 1] - back[k + 1]), Math.abs(on[k + 2] - back[k + 2]));
  }
  const picture = {};
  NAMES.forEach((n, i) => { picture[n] = { px: d[i].px, max: d[i].max, mean: +(d[i].sum / Math.max(1, d[i].px)).toFixed(4), over1: d[i].over1 }; });
  // the farthest ball in the frame: every pixel of the square around it, lens on against off
  let farBall = null;
  const v = new THREE.Vector3();
  for (const b of balls) {
    v.copy(b.mesh.position).applyMatrix4(camera.matrixWorldInverse);
    const depth = -v.z; if (!(depth > 0.05)) continue;
    v.copy(b.mesh.position).project(camera);
    const x = (v.x * 0.5 + 0.5) * W, y = (1 - (v.y * 0.5 + 0.5)) * H;
    const r = R * (H / 2) * camera.projectionMatrix.elements[5] / depth;
    if (x < r || y < r || x > W - r || y > H - r) continue;
    if (!farBall || depth > farBall.depth) farBall = { id: b.id, depth: +depth.toFixed(3), x: Math.round(x), y: Math.round(y), r: +r.toFixed(1) };
  }
  if (farBall) {
    const h = Math.ceil(farBall.r) + 3;
    let max = 0, n = 0, over1 = 0;
    for (let y = farBall.y - h; y <= farBall.y + h; y++) for (let x = farBall.x - h; x <= farBall.x + h; x++) {
      if (x < 0 || y < 0 || x >= W || y >= H) continue;
      if (Math.hypot(x - farBall.x, y - farBall.y) > farBall.r + 1.5) continue;   // the ball's disc and one pixel of rim
      const k = (y * W + x) * 4;
      const m = Math.max(Math.abs(on[k] - off[k]), Math.abs(on[k + 1] - off[k + 1]), Math.abs(on[k + 2] - off[k + 2]));
      n += 1; if (m > max) max = m; if (m > 1) over1 += 1;
    }

    farBall.crop = [Math.max(0, farBall.x - 40), Math.max(0, farBall.y - 30), 80, 60];

  const brief = (p) => (p.ok ? { zoneFar: p.lens.zoneFar, farPx: p.lens.farPx, drawn: p.lens.drawn, tablePx: p.table.px, tableMaxCoc: p.table.maxCoc, tableMaxBlend: p.table.maxBlend,
    maxCoc: Object.fromEntries(Object.entries(p.classes).map(([k, v]) => [k, v.maxCoc])), pictureMax: Object.fromEntries(Object.entries(p.picture).map(([k, v]) => [k, v.max])),
    pictureOver1: Object.fromEntries(Object.entries(p.picture).map(([k, v]) => [k, v.over1])), farBall: p.farBall ? { id: p.farBall.id, depth: p.farBall.depth, discMax: p.farBall.disc.max, discOver1: p.farBall.disc.over1, discPx: p.farBall.disc.px } : null } : p);
  for (const id of ['V2', 'V7', 'V3', 'V1']) {
    const [p, t, f] = VIEWS[id];
    camera.position.set(...p); camera.fov = f; camera.updateProjectionMatrix(); camera.lookAt(...t);
    post.dof.snap();
    out[id] = {};
    for (const mode of ['full', 'zone', 'mask', 'off']) {
      post.dof.guardMode = mode;
      const r = probeRun();
      out[id][mode] = mode === 'full' ? { ...brief(r), classesPx: r.ok ? Object.fromEntries(Object.entries(r.classes).map(([k, v]) => [k, v.px])) : null, outside: r.ok ? r.classes.outside : null, box: r.box } : brief(r);
    }
    post.dof.guardMode = 'full';
  }
  camera.position.set(...pos); camera.fov = fov; camera.updateProjectionMatrix(); camera.lookAt(...tgt); post.dof.snap(); frameNow();
  return out;
}
// ---- what a frame draws, at rest and moving (the tier's cost in counts) ---------------------------------------------------------
function planRun() {
  if (!post.enabled) return { enabled: false };
  const rows = {};
  const row = () => { const c = post.counts(); return { drew: c.frame.active.join(',') || '-', draws: c.frame.draws, lens: c.frame.dof, depthResolved: c.frame.depthValid, folded: c.frame.folded }; };
  for (let i = 0; i < 30; i++) frameNow(1 / 60);
  rows.rest = row();
  for (let i = 0; i < 12; i++) { camera.position.x += 0.05; camera.lookAt(...tgt); frameNow(1 / 60); }   // 3 m/s
  rows.moving = row();
  for (let i = 0; i < 12; i++) { camera.position.x += 0.012; camera.lookAt(...tgt); frameNow(1 / 60); }  // 0.7 m/s
  rows.movingSlowly = row();
  for (let i = 0; i < 12; i++) { camera.position.x -= 0.062; camera.lookAt(...tgt); frameNow(1 / 60); }
  for (let i = 0; i < 5; i++) frameNow(1 / 60);
  rows.justStopped = row();
  for (let i = 0; i < 90; i++) frameNow(1 / 60);
  rows.restAgain = row();
  const c = post.counts();
  return { tier, rows, passes: c.passes.list, programs: c.programs, targets: c.targets, bytes: c.bytes, depthFramesOfFrames: [c.seen.depthFrames, c.seen.frames] };
}

// ---- an enlarged crop of the frame, lens on against lens off (the lens's edges, the discs, a far ball) -----------------------------
function zoomRun(spec) {
  const crops = spec.split(';').slice(0, 3).map((t) => t.split(',').map(Number));
  const shot = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; c.getContext('2d').drawImage(renderer.domElement, 0, 0); return c; };
  frameNow(); frameNow();
  const a = shot();
  let b = a;
  if (post.enabled && post.dof?.enabled) { const ap = post.dof.aperture; post.dof.aperture = 0; frameNow(); frameNow(); b = shot(); post.dof.aperture = ap; frameNow(); }
  const ov = document.createElement('canvas'); ov.width = W; ov.height = H;
  ov.style.cssText = 'position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:10';
  const g = ov.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, W, H); g.imageSmoothingEnabled = false;
  const rowH = H / crops.length;
  g.font = '13px monospace';
  crops.forEach(([cx, cy, cw, ch], i) => {
    const k = Math.min((W / 2 - 4) / cw, (rowH - 4) / ch);
    g.drawImage(a, cx, cy, cw, ch, 0, i * rowH, cw * k, ch * k);
    g.drawImage(b, cx, cy, cw, ch, W / 2 + 4, i * rowH, cw * k, ch * k);
    g.fillStyle = 'rgba(0,0,0,0.55)'; g.fillRect(0, i * rowH, 420, 17); g.fillRect(W / 2 + 4, i * rowH, 80, 17);
    g.fillStyle = '#fff';
    g.fillText(`lens on | crop ${cw}x${ch} at (${cx},${cy}) x${k.toFixed(1)}`, 6, i * rowH + 13); g.fillText('lens off', W / 2 + 10, i * rowH + 13);
  });
  document.body.appendChild(ov);
}

// ---- small lights at two working resolutions: 360 rows (round 2's rule) | the default | lens off ------------------------------------
function abRun() {
  if (!post.enabled || !post.dof?.enabled) return { ok: false, reason: 'no lens on this tier' };
  const shot = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; c.getContext('2d', { willReadFrequently: true }).drawImage(renderer.domElement, 0, 0); return c; };
  const settle = () => { post.dof.snap(); frameNow(); frameNow(); };
  const rows0 = post.config.workRows;
  const cols = [];
  post.config.workRows = 360; settle(); cols.push({ name: '360 working rows (round 2)', c: shot(), f: post.counts().frame, targets: post.counts().targets.map((t) => `${t.w}x${t.h}`) });
  post.config.workRows = rows0; settle(); cols.push({ name: `${rows0} working rows at most (default)`, c: shot(), f: post.counts().frame, targets: post.counts().targets.map((t) => `${t.w}x${t.h}`) });
  const ap = post.dof.aperture; post.dof.aperture = 0; settle(); cols.push({ name: 'lens off', c: shot(), f: post.counts().frame, targets: [] }); post.dof.aperture = ap; settle();
  // the lights to show: the small emitters that are in the frame, nearest the middle first (or ?zoom= crops)
  const cw = 72, ch = 48;
  let crops = [];
  if (q.get('zoom')) crops = q.get('zoom').split(';').slice(0, 3).map((t) => t.split(',').map(Number)).map(([x, y]) => ({ x, y }));
  else {
    const v = new THREE.Vector3();
    const found = [];
    for (const d of dots) {
      v.copy(d.position).project(camera);
      const x = (v.x * 0.5 + 0.5) * W, y = (1 - (v.y * 0.5 + 0.5)) * H;
      if (v.z < 1 && x > cw && x < W - cw && y > ch && y < H - ch) found.push({ x: Math.round(x - cw / 2), y: Math.round(y - ch / 2), cx: x, cy: y, depth: +d.position.clone().applyMatrix4(camera.matrixWorldInverse).z.toFixed(2) * -1, px: +(0.022 * (H / 2) * camera.projectionMatrix.elements[5] / -d.position.clone().applyMatrix4(camera.matrixWorldInverse).z).toFixed(1) });
    }
    found.sort((a, b) => Math.hypot(a.cx - W / 2, a.cy - H / 3) - Math.hypot(b.cx - W / 2, b.cy - H / 3));
    crops = found.slice(0, 3);
  }
  // how round: the lit shape's outline (pixels over half of the white level in any channel) along 36 directions from its
  // centroid: (largest - smallest radius) / mean, and the width / height of its bounding box
  const roundness = (c, crop) => {
    const d = c.getContext('2d', { willReadFrequently: true }).getImageData(crop.x, crop.y, cw, ch).data;
    const on = (x, y) => { if (x < 0 || y < 0 || x >= cw || y >= ch) return false; const k = (y * cw + x) * 4; return Math.max(d[k], d[k + 1], d[k + 2]) > 200; };
    let sx = 0, sy = 0, n = 0, x0 = cw, x1 = -1, y0 = ch, y1 = -1;
    for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) if (on(x, y)) { sx += x; sy += y; n += 1; x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
    if (n < 4) return { px: n };
    const cx = sx / n, cy = sy / n; const rr = [];
    for (let a = 0; a < 36; a++) { const th = a * Math.PI / 18; let r = 0; while (r < 40 && on(Math.round(cx + Math.cos(th) * r), Math.round(cy + Math.sin(th) * r))) r += 0.25; rr.push(r); }
    const mean = rr.reduce((p, v) => p + v, 0) / rr.length;
    const diag = (rr[4] + rr[5] + rr[13] + rr[14] + rr[22] + rr[23] + rr[31] + rr[32]) / 8, axis = (rr[0] + rr[9] + rr[18] + rr[27]) / 4;
    // a disc fills pi / 4 = 0.785 of its bounding box, a square all of it
    return { px: n, box: [x1 - x0 + 1, y1 - y0 + 1], fill: +(n / ((x1 - x0 + 1) * (y1 - y0 + 1))).toFixed(3), meanRadius: +mean.toFixed(2), spread: +((Math.max(...rr) - Math.min(...rr)) / mean).toFixed(3), diagOverAxis: +(diag / axis).toFixed(3) };
  };
  const ov = document.createElement('canvas'); ov.width = W; ov.height = H;
  ov.style.cssText = 'position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:10';
  const g = ov.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, W, H); g.imageSmoothingEnabled = false;
  const colW = Math.floor(W / 3), rowH = Math.floor(H / Math.max(1, crops.length));
  const k = Math.min((colW - 4) / cw, (rowH - 4) / ch);
  g.font = '13px monospace';
  const out = { size: [W, H], lights: [] };
  crops.forEach((crop, i) => {
    const row = { at: [crop.x, crop.y], sourcePx: crop.px ?? null, depth: crop.depth ?? null, cols: {} };
    cols.forEach((col, j) => {
      g.drawImage(col.c, crop.x, crop.y, cw, ch, j * colW, i * rowH, cw * k, ch * k);
      row.cols[j === 0 ? 'rows360' : j === 1 ? 'default' : 'off'] = roundness(col.c, crop);
      g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillRect(j * colW, i * rowH, colW - 4, 17);
      g.fillStyle = '#fff'; g.fillText(`${col.name}${j < 2 ? `, scale ${col.f.scale}` : ''} | x${k.toFixed(1)}`, j * colW + 5, i * rowH + 13);
    });
    out.lights.push(row);
  });
  out.cols = cols.map((c) => ({ name: c.name, scale: c.f.scale, farPx: c.f.farPx, capPx: c.f.capPx, drew: c.f.active.join(','), targets: c.targets }));
  out.bytes = post.counts().bytes;
  document.body.appendChild(ov);
  return out;
}

// ---- the first frames of a move on the `still` tier: the cut against the ramp --------------------------------------------------------
function stripRun() {
  if (!post.enabled || !post.dof?.enabled) return { ok: false, reason: 'no lens on this tier' };
  const [sx, sy] = (q.get('stripcrop') || '540,30').split(',').map(Number);
  const cols = 6, cw = Math.floor(W / cols), chh = Math.floor(H / 4);
  const shot = () => { const c = document.createElement('canvas'); c.width = cw; c.height = chh; c.getContext('2d', { willReadFrequently: true }).drawImage(renderer.domElement, sx, sy, cw, chh, 0, 0, cw, chh); return c; };
  const px = (c) => c.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, cw, chh).data;
  const dist = (a, b) => { let sum = 0, max = 0; for (let i = 0; i < a.length; i += 4) { const m = Math.max(Math.abs(a[i] - b[i]), Math.abs(a[i + 1] - b[i + 1]), Math.abs(a[i + 2] - b[i + 2])); sum += m; if (m > max) max = m; } return { mean: +(sum / (a.length / 4)).toFixed(3), max }; };
  const row = () => { const f = post.counts().frame; return { drew: f.active.join(',') || '-', lens: f.dof, depth: f.depthValid }; };
  const cam0 = camera.position.clone(), ball = balls[1].mesh, ball0 = ball.position.clone();
  const home = () => { camera.position.copy(cam0); camera.lookAt(...tgt); ball.position.copy(ball0); post.dof.snap(); frameNow(1 / 60); frameNow(1 / 60); };
  const out = { tier, mode: post.dof.mode, crop: [sx, sy, cw, chh], runs: {} };
  const ov = document.createElement('canvas'); ov.width = W; ov.height = H;
  ov.style.cssText = 'position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:10';
  const g = ov.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, W, H); g.font = '12px monospace';
  // the lens-off picture of the resting frame (the room behind a moving ball does not change)
  home(); const ap = post.dof.aperture; post.dof.aperture = 0; frameNow(0); const offRest = px(shot()); post.dof.aperture = ap;
  const still0 = post.dof.stillOut, fade0 = post.config.fade, secs0 = still0 > 0 ? still0 : 0.08;
  let r = 0;
  for (const [kind, name, secs, fade] of [['ball', 'cut', 0, fade0], ['ball', 'mix', secs0, 'mix'], ['ball', 'ramp', secs0, 'dissolve'], ['ball', 'pull', secs0, 'pull']]) {
    post.dof.stillOut = secs; post.config.fade = fade; home();
    const frames = [];
    const cell = (label) => {
      const c = shot(); const f = row();
      f.farPx = post.counts().frame.farPx;
      if (kind === 'ball') f.fromLensOff = dist(px(c), offRest);
      frames.push(f);
      g.drawImage(c, frames.length * cw - cw, r * chh);
      g.fillStyle = 'rgba(0,0,0,0.65)'; g.fillRect(frames.length * cw - cw, r * chh, cw - 2, 15);
      g.fillStyle = '#fff'; g.fillText(`${{ cut: 'cut', mix: 'linear mix', ramp: 'dissolve', pull: 'aperture' }[name]}: ${label}, lens ${f.lens}`, frames.length * cw - cw + 3, r * chh + 11);
    };
    cell('rest');
    for (let i = 1; i < cols; i++) {
      ball.position.x += 0.002;   // a rolling ball, the camera at rest
      frameNow(1 / 60);
      cell(`move ${i}`);
      // inside the ramp, with a ball rolling: the readability probe, and the picture against the lens-off picture of the same frame
      if (name === 'ramp' && kind === 'ball' && i === 2) {
        const on = fullGrab();
        const p = post.dof.probe({ mask: true });
        if (p.ok) {
          const mask = p.mask; delete p.mask;
          post.dof.aperture = 0; frameNow(0); const off = fullGrab(); post.dof.aperture = ap; frameNow(0);
          let tableMax = 0, roomMax = 0, tablePx = 0;
          for (let j = 0, k4 = 0; j < mask.length; j++, k4 += 4) { const m = Math.max(Math.abs(on[k4] - off[k4]), Math.abs(on[k4 + 1] - off[k4 + 1]), Math.abs(on[k4 + 2] - off[k4 + 2])); if (mask[j] === 0) { if (m > roomMax) roomMax = m; } else { tablePx += 1; if (m > tableMax) tableMax = m; } }
          out.probeInRamp = { frame: i, lens: p.lens, table: p.table, classes: p.classes, picture: { tablePx, tableMax, roomMax }, lensAfterProbe: row().lens };
        } else out.probeInRamp = p;
      }
    }
    out.runs[name] = frames;
    r += 1;
  }
  // the camera moving (numbers only): a slow orbit, 0.24 m/s
  post.dof.stillOut = still0; post.config.fade = fade0; home();
  { const rows = []; for (let i = 0; i < 6; i++) { camera.position.z += 0.004; camera.lookAt(...tgt); frameNow(1 / 60); rows.push(row()); } out.runs.cameraDefault = rows; }
  // the way back, at 60 Hz: the first frame with a lens after a stop, and how it grows
  post.dof.stillOut = still0; post.config.fade = fade0; home();
  for (let i = 0; i < 6; i++) { camera.position.z += 0.004; camera.lookAt(...tgt); frameNow(1 / 60); }
  const back = [], backPx = []; for (let i = 0; i < 90; i++) { frameNow(1 / 60); back.push(row().lens); backPx.push(post.counts().frame.farPx); }
  out.back = { firstLensFrame: back.findIndex((v) => v > 0) + 1, lens: back.slice(0, 24), farPx: backPx.slice(0, 24), at30: back[29], at60: back[59], wholeAt: back.findIndex((v) => v === 1) + 1 };
  home();
  document.body.appendChild(ov);
  return out;
}

// ---- frames ------------------------------------------------------------------------------------------------------------------
const want = Math.max(2, Number(q.get('frames')) || 4);
const moving = q.get('move') === '1';
let frames = 0, clock = 0;
renderer.setAnimationLoop(() => {
  const dt = 1 / 60; clock += dt; game.clock = clock;
  if (moving) { camera.position.x += 0.03; camera.lookAt(...tgt); }
  for (const fn of [...frameFns]) fn(clock, dt);
  composer.render();
  if (++frames === want) {
    if (!moving) renderer.setAnimationLoop(null);
    if (q.get('proof') === '1') { try { window.__proof = proof(); } catch (e) { window.__proof = { error: String(e?.stack ?? e) }; } }
    if (q.get('probe') === '1') { try { window.__probe = probeRun(); } catch (e) { window.__probe = { error: String(e?.stack ?? e) }; } }
    if (q.get('probe') === 'all') { try { window.__probe = probeAll(); } catch (e) { window.__probe = { error: String(e?.stack ?? e) }; } }
    if (q.get('zoom')) { try { zoomRun(q.get('zoom')); } catch (e) { console.error(e); } }
    if (q.get('plan') === '1') { try { window.__plan = planRun(); } catch (e) { window.__plan = { error: String(e?.stack ?? e) }; } }
    if (q.get('strip') === '1') { try { window.__strip = stripRun(); } catch (e) { window.__strip = { error: String(e?.stack ?? e) }; } }
    if (q.get('ab') === 'rows') { try { window.__ab = abRun(); } catch (e) { window.__ab = { error: String(e?.stack ?? e) }; } }
    window.__state = post.enabled ? post.counts() : { enabled: false, reason: post.reason };
    window.__ready = true;
  }
});
</script>
