<meta charset="utf-8">
<title>club dev page</title>
<style>html, body { margin: 0; height: 100%; background: #000; overflow: hidden; } canvas { display: block; }</style>
<script type="importmap">
{ "imports": { "three": "../../vendor/three.module.min.js" } }
</script>

<body>
<script type="module">
import * as THREE from 'three';
const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85; // the tournament look's exposure
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050505);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 60);
const VIEWS = { wide: [[-4.0, 1.6, 2.6], [0, 0.3, 0], 50], play: [[-2.3, 1.05, 1.35], [0.1, 0, 0], 40] };
const [pos, tgt, fov] = VIEWS[q.get('view')] ?? VIEWS.wide;
camera.position.set(...pos); camera.fov = fov; camera.updateProjectionMatrix(); camera.lookAt(...tgt);
// stand-in content: a table-sized slab on a floor
scene.add(new THREE.HemisphereLight(0xffffff, 0x202020, 1.0));
const slab = new THREE.Mesh(new THREE.BoxGeometry(2.84, 0.1, 1.57), new THREE.MeshStandardMaterial({ color: 0x2a6fb0, roughness: 0.9 }));
slab.position.y = -0.05; scene.add(slab);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(9, 6), new THREE.MeshStandardMaterial({ color: 0x3a2a20, roughness: 0.6 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -0.8; scene.add(floor);
window.__dev = { THREE, renderer, scene, camera };
let frames = 0;
renderer.setAnimationLoop(() => { renderer.render(scene, camera); if (++frames === 3) window.__ready = true; });
</script>
</body>
</html>
